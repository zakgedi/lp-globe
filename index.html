<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="NOVA GLOBE"><meta name="theme-color" content="#ffffff"><title>NOVA GLOBE</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet"><style>:root{--ink:#141414;--mut:rgba(0,0,0,.52);--mut2:rgba(0,0,0,.38);--line:rgba(0,0,0,.16);--line2:rgba(0,0,0,.32);--paper:#fff;--tint:#f7f6f2}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Newsreader',Georgia,serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
a{color:inherit}
.shell{max-width:760px;margin:0 auto;padding:0 20px 96px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:26px 0 18px;border-bottom:1px solid var(--ink)}
.top h1{font-weight:500;font-size:19px;letter-spacing:.22em;margin:0}
.dnav{display:flex;gap:22px}
.dnav a{font-style:italic;color:var(--mut);text-decoration:none;font-size:14.5px}
.dnav a.active{font-style:normal;color:var(--ink);text-decoration:underline;text-underline-offset:4px}
#view{padding-top:22px}
.back{font-style:italic;color:var(--mut);font-size:13.5px;cursor:pointer;margin-bottom:16px;display:inline-block}
.back:hover{color:var(--ink)}
.search{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line2);padding:0 0 8px;margin-bottom:6px;color:var(--mut)}
.search input{flex:1;border:0;outline:0;font-family:inherit;font-size:16px;color:var(--ink);background:transparent;padding:4px 0}
.ptable{margin-top:4px}
.pthead{display:grid;grid-template-columns:38px 1fr auto;gap:10px;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut2);padding:10px 0 6px;border-bottom:1px solid var(--ink)}
.prow{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.prow:hover{background:var(--tint)}
.pr{font-style:italic;color:var(--mut);font-size:13px}
.pn{font-size:16.5px;font-weight:500}
.pn .pc{display:block;font-weight:400;font-style:italic;color:var(--mut);font-size:12.5px;margin-top:1px}
.pa{color:var(--mut);font-size:13.5px;text-align:right;white-space:nowrap}
.record{padding-top:2px}
.receyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
.recname{font-weight:500;font-size:30px;margin:0 0 4px;letter-spacing:.01em}
.recloc{font-style:italic;color:var(--mut);font-size:15px;margin-bottom:18px}
.knowrow{display:flex;align-items:center;gap:9px;font-size:15px;padding:11px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;margin-bottom:18px;user-select:none}
.knowrow input{width:16px;height:16px;accent-color:#141414;cursor:pointer}
.frow{margin:0 0 18px}
.frow label{display:block;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.textin{width:100%;border:1px solid var(--line2);background:#fff;padding:10px 12px;font-size:15px;font-family:inherit;color:var(--ink);outline:0;border-radius:0;resize:vertical}
.textin:focus{border-color:var(--ink)}
.askrow{display:flex;gap:8px}
.askrow .askin{flex:1}
.primary{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:10px 20px;font-size:11px;letter-spacing:.26em;text-transform:uppercase;font-family:inherit;cursor:pointer;border-radius:0}
.primary:hover{background:#000}
.reqzone{margin:-6px 0 20px}
.req{border:1px solid var(--line);border-left:2px solid var(--ink);padding:10px 12px;margin-bottom:8px}
.req.ret{background:var(--tint)}
.reqhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.reqhead b{font-weight:600;font-size:14.5px}
.reqmeta{font-style:italic;color:var(--mut);font-size:12px;flex:1}
.remove{border:0;background:none;color:var(--mut);font-size:16px;cursor:pointer;padding:0 2px;line-height:1}
.remove:hover{color:var(--ink)}
.reqbody{font-size:14px;color:var(--ink);margin-top:6px;white-space:pre-wrap}
.secthead{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--ink);padding-bottom:6px;margin:26px 0 4px;font-size:11px;letter-spacing:.24em;text-transform:uppercase}
.secthead span{color:var(--mut);letter-spacing:0;text-transform:none;font-style:italic}
.staffrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.staffrow:hover{background:var(--tint)}
.sn{font-size:16px;font-weight:500}
.sr{font-style:italic;color:var(--mut);font-size:13px;text-align:right}
.unv{font-style:italic;color:#8a2f23;font-size:11.5px;border:1px solid rgba(138,47,35,.4);padding:1px 6px;white-space:nowrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.pill{display:inline-block;border:1px solid var(--line2);padding:6px 12px;font-size:13px;text-decoration:none;color:var(--ink)}
.pill:hover{border-color:var(--ink)}
.pill.warn{border-color:rgba(138,47,35,.45);color:#8a2f23;font-style:italic}
.note{font-size:14.5px;color:var(--ink);background:var(--tint);padding:10px 12px;margin-bottom:18px}
.note a{color:var(--mut);font-style:italic}
.empty{font-style:italic;color:var(--mut);padding:26px 0;font-size:15px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:#fff;font-size:13.5px;padding:9px 16px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:120;font-style:italic}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.tabbar{display:none}
#globewrap{position:fixed;inset:0;background:#fff;z-index:60;overflow:hidden;touch-action:none}
#globesvg{display:block;width:100%;height:100%;cursor:grab}
#globesvg:active{cursor:grabbing}
.gback{position:absolute;top:14px;left:16px;z-index:62;font-style:italic;color:var(--mut);text-decoration:none;font-size:14px;background:rgba(255,255,255,.85);padding:6px 10px;border:1px solid var(--line)}
.gback:hover{color:var(--ink);border-color:var(--ink)}
.gzoom{position:absolute;top:14px;right:16px;z-index:62;display:flex;flex-direction:column;gap:6px}
.gzoom button{width:40px;height:40px;border:1px solid var(--line2);background:rgba(255,255,255,.92);font-family:inherit;font-size:20px;color:var(--ink);cursor:pointer;line-height:1;border-radius:0}
.gzoom button:hover{border-color:var(--ink)}
.ghint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-style:italic;color:var(--mut2);font-size:12.5px;pointer-events:none;z-index:61}
#citypanel{position:absolute;left:12px;bottom:34px;z-index:63;width:min(360px,calc(100vw - 24px));max-height:52vh;overflow:auto;background:rgba(255,255,255,.96);border:1px solid var(--line2);padding:14px 16px;box-shadow:0 6px 28px rgba(0,0,0,.10)}
#citypanel:empty{display:none}
.cityhead{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--ink);padding-bottom:8px;margin-bottom:4px}
.cityhead h2{font-weight:500;font-size:21px;margin:0;flex:1}
.csub{font-style:italic;color:var(--mut);font-size:12.5px}
.cclose{font-size:19px}
.gfirm{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:14.5px}
.gfirm:last-child{border-bottom:0}
.gfirm:hover{background:var(--tint)}
.gr{font-style:italic;color:var(--mut);font-size:12px}
.gn{font-weight:500}
.ga{color:var(--mut);font-size:12px;text-align:right;font-style:italic}
@media (max-width:640px){
 .shell{padding:0 16px 92px}
 .top{padding:20px 0 14px}
 .dnav{display:none}
 .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line2);z-index:40}
 .tabbar a{flex:1;text-align:center;padding:13px 0 15px;font-style:italic;color:var(--mut);text-decoration:none;font-size:14px}
 .tabbar a.active{font-style:normal;color:var(--ink);text-decoration:underline;text-underline-offset:4px}
 .recname{font-size:25px}
 #citypanel{max-height:46vh;bottom:30px}
}
body.locked .shell,body.locked .tabbar{display:none}
#lock{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;padding:28px;z-index:100}
#lock .lbox{max-width:340px;width:100%;text-align:center}
#lock h1{font-weight:500;font-size:26px;letter-spacing:.22em;margin:0 0 18px}
#lock .lrule{width:56px;height:1px;background:var(--ink);margin:0 auto 22px}
#lock .lhint{font-style:italic;color:var(--mut);font-size:14px;margin:0 0 24px}
#lock input[type=password]{width:100%;border:1px solid var(--line2);background:#fff;padding:12px 14px;font-size:16px;font-family:inherit;color:var(--ink);outline:0;text-align:center;border-radius:0}
#lock input[type=password]:focus{border-color:var(--ink)}
#lock button{width:100%;margin-top:10px;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:12px;font-size:12px;letter-spacing:.28em;text-transform:uppercase;font-family:inherit;cursor:pointer;border-radius:0}
#lock .lkeep{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:16px;color:var(--mut);font-size:12.5px;cursor:pointer}
#lock .lkeep input{width:15px;height:15px;accent-color:#141414}
#lock .lerr{color:#8a2f23;font-style:italic;font-size:13px;margin-top:14px;min-height:18px}
#lock .busy{opacity:.55;pointer-events:none}
</style></head><body class="locked"><div id="lock"><div class="lbox"><h1>NOVA GLOBE</h1><div class="lrule"></div><p class="lhint">Private. Enter the passphrase to open.</p><form id="lf" autocomplete="off"><input id="lpw" type="password" placeholder="Passphrase" autofocus><button type="submit" id="lgo">Open</button><label class="lkeep"><input type="checkbox" id="lkeep" checked>Keep unlocked on this device</label><div class="lerr" id="lerr"></div></form></div></div><main class="shell"><header class="top"><div><h1>NOVA GLOBE</h1></div><nav class="dnav"><a href="#/list" data-tab="list">List</a><a href="#/globe" data-tab="globe">Globe</a></nav></header><section id="view"></section></main><nav class="tabbar"><a href="#/list" data-tab="list">List</a><a href="#/globe" data-tab="globe">Globe</a></nav><div class="toast" id="toast"></div><script>

function askBlock(kind,a,b){const key=kind==='firm'?('firm:'+a):('person:'+a+':'+b);const reqs=reqsOf(key);
 let h='<div class="frow"><label>Ask Instinct</label><div class="askrow"><input class="textin askin" id="askin" placeholder="Draft the intro, research the mandate\u2026" onkeydown="if(event.key===\'Enter\'){askInstinct(\''+kind+'\','+a+','+b+')}"><button class="primary askgo" onclick="askInstinct(\''+kind+'\','+a+','+b+')">Ask</button></div></div>';
 if(reqs.length){h+='<div class="reqzone">'+reqs.slice().reverse().map(function(r){
  if(r.kind==='return')return '<div class="req ret"><div class="reqhead"><b>'+esc(r.title)+'</b><span class="reqmeta">From Instinct \u00b7 '+fmtD(r.d)+'</span><button class="remove" onclick="dismissReq(\''+key+'\','+r.id+')">&times;</button></div><div class="reqbody">'+esc(r.body)+'</div></div>';
  return '<div class="req"><div class="reqhead"><b>'+esc(r.text)+'</b><span class="reqmeta">'+fmtD(r.d)+' \u00b7 '+esc(r.status||'With Instinct')+'</span><button class="remove" onclick="dismissReq(\''+key+'\','+r.id+')">&times;</button></div></div>'}).join('')+'</div>'}
 return h}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(function(){t.classList.remove('show')},1800)}
function go(h){location.hash=h}

function curRoute(){const h=(location.hash||'#/list').slice(2);const p=h.split('/');let v=p[0]||'list';if(v==='today'||v==='pipeline')v='list';if(v==='map')v='globe';return {view:v,a:p[1],b:p[2]}}
function route(){render();window.scrollTo(0,0)}
function render(){const r=curRoute();const v=document.getElementById('view');
 if(r.view==='globe'){v.innerHTML=viewGlobe();initGlobe();renderGlobeCity()}
 else if(r.view==='firm'){v.innerHTML=viewFirm(+r.a)}
 else if(r.view==='person'){v.innerHTML=viewPerson(+r.a,+r.b)}
 else{v.innerHTML=viewList();renderListRows()}
 document.querySelectorAll('[data-tab]').forEach(function(a){const t=a.getAttribute('data-tab');a.classList.toggle('active',t===r.view||((r.view==='firm'||r.view==='person')&&t==='list'))});
}

let plQ='';
function viewList(){
 return '<div class="ptools"><label class="search"><span>\u2315</span><input id="plq" placeholder="Search firms, types, cities\u2026" value="'+esc(plQ)+'" oninput="plQ=this.value;renderListRows()"></label></div><div class="ptable"><div class="pthead"><span>\u2116</span><span>Firm</span><span style="text-align:right">AUM</span></div><div id="plrows"></div></div>';
}
function renderListRows(){const el=document.getElementById('plrows');if(!el)return;const q=plQ.trim().toLowerCase();
 const rows=firms.map(function(f,i){return {f:f,i:i}}).filter(function(x){return !q||x.f.name.toLowerCase().indexOf(q)>=0||(x.f.type||'').toLowerCase().indexOf(q)>=0||(x.f.location||'').toLowerCase().indexOf(q)>=0}).sort(function(a,b){return b.f.rankNum-a.f.rankNum||a.f.name.localeCompare(b.f.name)});
 if(!rows.length){el.innerHTML='<div class="empty">No firms match.</div>';return}
 el.innerHTML=rows.map(function(x){const f=x.f;const sub=[f.type,f.location].filter(Boolean).join(' \u00b7 ');return '<div class="prow" onclick="go(\'#/firm/'+x.i+'\')"><span class="pr">'+f.rankNum+'</span><span class="pn">'+esc(f.name)+(sub?'<span class="pc">'+esc(sub)+'</span>':'')+'</span><span class="pa">'+esc(f.aum||'\u2014')+'</span></div>'}).join('');
}

function knowRow(scope,a,b){const o=scope==='firm'?fs(a):ps(a,b);return '<label class="knowrow"><input type="checkbox" '+(isKnown(o)?'checked':'')+' onchange="toggleKnown(\''+scope+'\','+a+','+b+')"> I know them</label>'}

function viewFirm(fi){const f=firms[fi];if(!f)return '<div class="empty">Firm not found.</div>';
 const F=S.firms[String(fi)]||{};
 let h='<div class="back" onclick="go(\'#/list\')">&larr; List</div>';
 h+='<div class="record"><div class="receyebrow">Rank '+(f.rank||f.rankNum)+(f.type?' \u00b7 '+esc(f.type):'')+(f.aum?' \u00b7 '+esc(f.aum):'')+'</div>';
 h+='<h2 class="recname">'+esc(f.name)+'</h2><div class="recloc">'+esc(f.location||'')+'</div>';
 h+=knowRow('firm',fi,0);
 h+='<div class="frow"><label>Notes</label><textarea class="textin" rows="3" placeholder="Context, angle, mandate\u2026" onchange="setFirmField('+fi+',\'notes\',this.value)">'+esc(F.notes||'')+'</textarea></div>';
 h+=askBlock('firm',fi,0);
 h+='<div class="secthead">People <span>'+f.contacts.length+'</span></div>';
 f.contacts.forEach(function(c,ci){
  h+='<div class="staffrow" onclick="go(\'#/person/'+fi+'/'+ci+'\')"><span class="sn">'+esc(c.name)+'</span><span class="sr">'+esc(c.role||'')+'</span>'+(c.unverified?'<span class="unv">Unverified</span>':'')+'</div>'});
 h+='</div>';
 return h;
}

function viewPerson(fi,ci){const f=firms[fi];const c=f&&f.contacts[ci];if(!c)return '<div class="empty">Person not found.</div>';
 const P=S.people[pkey(fi,ci)]||{};
 const first=(c.name||'').split(' ')[0];
 const mail=c.email?('mailto:'+c.email+'?subject='+encodeURIComponent('Nova x '+f.name)+'&body='+encodeURIComponent('Hi '+first+',\n\n')):'';
 let h='<div class="back" onclick="go(\'#/firm/'+fi+'\')">&larr; '+esc(f.name)+'</div>';
 h+='<div class="record"><h2 class="recname">'+esc(c.name)+'</h2><div class="recloc">'+esc(c.role||'')+' \u00b7 '+esc(f.name)+'</div>';
 h+='<div class="actions">';
 if(c.email)h+='<a class="pill" href="'+mail+'">'+esc(c.email)+'</a>'+(c.unverified?'<span class="pill warn">Unverified</span>':'');
 else if(c.unverified)h+='<span class="pill warn">Unverified</span>';
 if(c.linkedin)h+='<a class="pill" href="'+esc(c.linkedin)+'" target="_blank" rel="noopener">LinkedIn &#8599;</a>';
 h+='</div>';
 if(c.notes)h+='<div class="note">'+linkify(esc(c.notes))+'</div>';
 h+=knowRow('person',fi,ci);
 h+='<div class="frow"><label>Notes</label><textarea class="textin" rows="3" placeholder="What they care about, angle, context\u2026" onchange="setPersonField('+fi+','+ci+',\'notes\',this.value)">'+esc(P.notes||'')+'</textarea></div>';
 h+=askBlock('person',fi,ci);
 h+='</div>';
 return h;
}

function cityKey(loc){return String(loc||'').split(',')[0].trim()}
function cityClusters(){const m={};firms.forEach(function(f,i){const k=cityKey(f.location);if(!k||k==='Location unknown'||k==='Unknown')return;if(!m[k])m[k]={name:k,firms:[],top:0};m[k].firms.push(i);m[k].top=Math.max(m[k].top,f.rankNum)});return Object.values(m).sort(function(a,b){return b.top-a.top||b.firms.length-a.firms.length})}
function clusterContacts(c){return c.firms.reduce(function(a,i){return a+firms[i].contacts.length},0)}

let selCity=null,globeProj=null,globeCountries=null,globeCities=[],globeDragged=false,globeK=1,globeDraw=null,baseR=300,globeZoom=null,globeSvg=null;

function viewGlobe(){
 return '<div id="globewrap"><svg id="globesvg"></svg><a class="gback" href="#/list">&larr; List</a><div class="gzoom"><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">&minus;</button></div><div class="ghint">drag to turn \u00b7 scroll or pinch to zoom \u00b7 tap a city</div><div id="citypanel"></div></div>';
}

function initGlobe(){
 const el=document.getElementById('globesvg');if(!el||typeof d3==='undefined')return;
 const wrap=document.getElementById('globewrap');
 const W=wrap.clientWidth||window.innerWidth,H=wrap.clientHeight||window.innerHeight;
 const keepRot=globeProj?globeProj.rotate():[60,-30];
 baseR=Math.min(W,H)*0.44;
 const cs=cityClusters();
 globeCities=cs.map(function(c){const co=COORDS[c.name];return co?{n:c.name,c:co,f:c.firms.length,top:c.top}:null}).filter(Boolean);
 if(selCity&&!globeCities.some(function(x){return x.n===selCity}))selCity=null;
 const svg=d3.select(el).attr('width',W).attr('height',H).attr('viewBox','0 0 '+W+' '+H);svg.selectAll('*').remove();
 globeSvg=svg;
 const proj=d3.geoOrthographic().scale(baseR*globeK).translate([W/2,H/2]).clipAngle(90).rotate(keepRot);globeProj=proj;
 const path=d3.geoPath(proj);
 const sphere=svg.append('path').datum({type:'Sphere'}).attr('fill','#fff').attr('stroke','#141414').attr('stroke-width',1);
 const grat=svg.append('path').datum(d3.geoGraticule10()).attr('fill','none').attr('stroke','#141414').attr('stroke-opacity',.13).attr('stroke-width',.6);
 const land=svg.append('path').attr('fill','#141414').attr('fill-opacity',.07).attr('stroke','#141414').attr('stroke-opacity',.5).attr('stroke-width',.6);
 const dots=svg.append('g'),labels=svg.append('g');
 if(!globeCountries&&typeof WORLD!=='undefined'){try{globeCountries=topojson.feature(WORLD,WORLD.objects.countries)}catch(e){}}
 function draw(){sphere.attr('d',path);grat.attr('d',path);if(globeCountries)land.attr('d',path(globeCountries));
  const vis=function(c){const r=proj.rotate();return d3.geoDistance(c.c,[-r[0],-r[1]])<Math.PI/2};
  const zr=Math.sqrt(globeK);
  const ds=dots.selectAll('circle').data(globeCities.filter(vis),function(d){return d.n});
  ds.join('circle').attr('cx',function(d){return proj(d.c)[0]}).attr('cy',function(d){return proj(d.c)[1]}).attr('r',function(d){return (d.n===selCity?5:Math.max(2,Math.sqrt(d.f)*1.2))*Math.min(zr,2.4)}).attr('fill',function(d){return d.n===selCity?'#141414':'#fff'}).attr('stroke','#141414').attr('stroke-width',1.2).style('cursor','pointer').on('click',function(e,d){selCity=d.n;globeDragged=true;draw();renderGlobeCity()});
  var placed=[];var lcand=globeCities.filter(function(d){return vis(d)&&(d.f>=10||d.n===selCity||(globeK>2.2&&d.f>=3))}).sort(function(a,b){return (b.n===selCity)-(a.n===selCity)||b.f-a.f}).filter(function(d){var p=proj(d.c);for(var i=0;i<placed.length;i++){if(Math.abs(placed[i][0]-p[0])<56&&Math.abs(placed[i][1]-p[1])<14)return false}placed.push(p);return true});
  const ls=labels.selectAll('text').data(lcand,function(d){return d.n});
  ls.join('text').attr('x',function(d){return proj(d.c)[0]+8}).attr('y',function(d){return proj(d.c)[1]+4}).text(function(d){return d.n}).attr('font-size','11px').attr('font-style',function(d){return d.n===selCity?'normal':'italic'}).attr('font-weight',function(d){return d.n===selCity?'600':'400'}).attr('fill',function(d){return d.n===selCity?'#141414':'rgba(0,0,0,.55)'}).attr('pointer-events','none');
 }
 globeDraw=draw;
 const zoom=d3.zoom().scaleExtent([0.6,12]).filter(function(e){return !e.ctrlKey&&(e.type==='wheel'||e.type==='dblclick')||(e.touches&&e.touches.length===2)}).on('zoom',function(e){globeK=e.transform.k;proj.scale(baseR*globeK);globeDragged=true;draw()});
 globeZoom=zoom;
 svg.call(zoom);
 const drag=d3.drag().on('start',function(){globeDragged=true}).on('drag',function(e){const r=proj.rotate();const k=0.4*(baseR/proj.scale());proj.rotate([r[0]+e.dx*k,Math.max(-70,Math.min(70,r[1]-e.dy*k))]);draw()});
 svg.call(drag);
 const zi=document.getElementById('zin'),zo=document.getElementById('zout');
 if(zi)zi.addEventListener('click',function(){globeDragged=true;svg.transition().duration(280).call(zoom.scaleBy,1.8)});
 if(zo)zo.addEventListener('click',function(){globeDragged=true;svg.transition().duration(280).call(zoom.scaleBy,1/1.8)});
 d3.timer(function(){if(!document.getElementById('globesvg'))return true;if(globeDragged)return true;const r=proj.rotate();proj.rotate([r[0]+0.05,r[1]]);draw();return false});
 draw();
}

function renderGlobeCity(){
 const el=document.getElementById('citypanel');if(!el)return;
 if(!selCity){el.innerHTML='';return}
 const cs=cityClusters();const c=cs.find(function(x){return x.name===selCity});
 if(!c){el.innerHTML='';return}
 const cc=clusterContacts(c);
 const pairs=c.firms.map(function(i){return {f:firms[i],i:i}}).sort(function(a,b){return b.f.rankNum-a.f.rankNum||a.f.name.localeCompare(b.f.name)});
 let h='<div class="cityhead"><h2>'+esc(selCity)+'</h2><span class="csub">'+c.firms.length+' firms \u00b7 '+cc+' contacts</span><button class="remove cclose" onclick="selCity=null;renderGlobeCity();if(globeDraw)globeDraw()">&times;</button></div>';
 pairs.forEach(function(p){h+='<div class="gfirm" onclick="go(\'#/firm/'+p.i+'\')"><span class="gr">'+p.f.rankNum+'</span><span class="gn">'+esc(p.f.name)+'</span><span class="ga">'+(p.f.aum?esc(p.f.aum)+' \u00b7 ':'')+p.f.contacts.length+' contacts</span></div>'});
 el.innerHTML=h;
}

function b64u(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function deriveKey(pw){var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64u(LS),iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt'])}
async function openWith(key){
  try{
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u(LI)},key,b64u(LD));
    firms=JSON.parse(new TextDecoder().decode(pt));
    document.body.classList.remove('locked');
    var lk=document.getElementById('lock');if(lk)lk.remove();
    startApp();
    return true;
  }catch(e){return false}
}
(async function(){
  var saved=localStorage.getItem('nova-globe-key')||sessionStorage.getItem('nova-globe-key');
  if(saved){try{var raw=b64u(saved);var key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);var ok=await openWith(key);if(!ok){localStorage.removeItem('nova-globe-key');sessionStorage.removeItem('nova-globe-key');location.reload()}return}catch(e){}}
})();
document.getElementById('lf').addEventListener('submit',async function(ev){
  ev.preventDefault();
  var pw=document.getElementById('lpw').value,err=document.getElementById('lerr'),btn=document.getElementById('lgo');
  if(!pw){err.textContent='Enter the passphrase.';return}
  btn.classList.add('busy');btn.textContent='Opening';err.textContent='';
  try{
    var key=await deriveKey(pw);
    var raw=await crypto.subtle.exportKey('raw',key);
    var ok=await openWith(key);
    if(!ok){err.textContent='Wrong passphrase.';btn.classList.remove('busy');btn.textContent='Open';return}
    var b64k=btoa(String.fromCharCode.apply(null,new Uint8Array(raw)));
    if(document.getElementById('lkeep').checked){localStorage.setItem('nova-globe-key',b64k)}else{sessionStorage.setItem('nova-globe-key',b64k)}
  }catch(e){err.textContent='Something went wrong. Try again.';btn.classList.remove('busy');btn.textContent='Open'}
});
