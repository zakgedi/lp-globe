<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="NOVA GLOBE"><meta name="theme-color" content="#ffffff"><title>NOVA GLOBE</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet"><style>:root{--ink:#141414;--mut:rgba(0,0,0,.52);--mut2:rgba(0,0,0,.38);--line:rgba(0,0,0,.16);--line2:rgba(0,0,0,.32);--paper:#fff;--tint:#f7f6f2}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Newsreader',Georgia,'Times New Roman',serif;font-size:15px;line-height:1.45}
a{color:var(--ink)}
button{font-family:inherit;cursor:pointer}
.shell{max-width:760px;margin:0 auto;padding:18px 18px 96px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:6px 0 14px;border-bottom:2px solid var(--ink);margin-bottom:18px}
.eyebrow{font-size:10px;letter-spacing:.34em;color:var(--mut);text-transform:uppercase;margin-bottom:6px}
h1{font-size:30px;font-weight:500;letter-spacing:.18em;margin:0}
.dnav{display:flex;gap:18px}
.dnav a{font-style:italic;color:var(--mut);text-decoration:none;font-size:14px}
.dnav a.active{font-style:normal;color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.tripbadge{font-style:normal;font-size:10px;vertical-align:super}
h2{font-weight:500}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
.select,.textin{width:100%;padding:9px 10px;border:1px solid var(--line2);border-radius:0;background:#fff}
.select:focus,.textin:focus{outline:1px solid var(--ink)}
.primary{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:10px 18px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;border-radius:0}
.secondary{background:#fff;color:var(--ink);border:1px solid var(--line2);padding:10px 18px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;border-radius:0}
.chip{border:1px solid var(--line2);background:#fff;padding:5px 10px;font-size:12.5px;border-radius:0}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.back{font-style:italic;color:var(--mut);font-size:13.5px;margin:2px 0 12px;cursor:pointer}
.empty{color:var(--mut);font-style:italic;padding:24px 0;text-align:center}
.quiet{color:var(--mut);font-style:italic;font-size:13.5px}
.pad{padding:8px 0}

/* today */
.todate{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--mut);text-align:center;margin:4px 0 10px}
.tstats{display:flex;justify-content:space-between;border-top:1px solid var(--ink);border-bottom:1px solid var(--line);padding:10px 2px;margin-bottom:22px}
.tstat{display:flex;align-items:baseline;gap:6px}
.tstat b{font-size:24px;font-weight:500}
.tstat span{font-size:11px;color:var(--mut)}
.sect{margin-bottom:24px}
.secthead{font-size:20px;font-weight:500;border-bottom:1px solid var(--ink);padding-bottom:6px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:baseline}
.secthead span{font-size:12px;font-style:italic;color:var(--mut);font-weight:400}
.secthead.gap{margin-top:22px}
.qitem{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.qitem:last-child{border-bottom:none}
.qrank{font-size:12px;color:var(--mut);width:14px;flex:none}
.qbody{flex:1;min-width:0}
.qbody b{font-weight:500;font-size:15px}
.qbody .qsub{display:block;font-size:12.5px;color:var(--mut)}
.qbody .qsub em{font-style:italic}
.lead{flex:1;border-bottom:1px dotted var(--mut2);margin:0 4px;min-width:16px}
.qdate{font-size:13px;flex:none}
.qdate.over{color:#8a1f1f}
.qown{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;flex:none;display:flex;align-items:center;gap:6px}
.qgo{font-size:13px;font-style:italic;color:var(--mut);flex:none}

/* avatars */
.owns{display:inline-flex;gap:3px;flex:none}
.own{width:19px;height:19px;background:var(--ink);color:#fff;font-size:9px;display:inline-flex;align-items:center;justify-content:center;font-family:ui-monospace,Menlo,monospace;letter-spacing:.02em}
.own.more{background:#fff;color:var(--ink);border:1px solid var(--line2)}

/* pipeline */
.ptabs{display:flex;gap:16px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:0}.ptabs::-webkit-scrollbar{display:none}.ptab{white-space:nowrap}
.ptab{background:none;border:none;padding:0 0 2px;font-size:13.5px;font-style:italic;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-10px}
.ptab.on{font-style:normal;color:var(--ink);border-bottom-color:var(--ink)}
.ptools{display:flex;gap:8px;margin:12px 0 8px}
.ptools .search{flex:1;display:flex;align-items:center;gap:6px;border:1px solid var(--line2);padding:0 8px}
.ptools .search span{color:var(--mut)}
.ptools .search input{flex:1;border:none;padding:9px 0;background:none}
.ptools .search input:focus{outline:none}
.ptools .select{width:auto;flex:none}
.ptable{width:100%}
.pthead,.ptrow{display:grid;grid-template-columns:26px minmax(0,1fr) auto auto;gap:10px;align-items:baseline}
.pthead{font-size:10px;letter-spacing:.22em;color:var(--mut);text-transform:uppercase;border-bottom:1px solid var(--ink);padding:8px 0 6px}
.ptrow{padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ptrow .pr{font-size:12px;color:var(--mut)}
.ptrow .pn{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptrow .ps{font-style:italic;font-size:12.5px;color:var(--mut);max-width:96px}
.ptrow .pa{font-size:12.5px;white-space:nowrap;text-align:right;max-width:88px;overflow:hidden;text-overflow:ellipsis}
.ptrow .po{justify-self:end}
@media(max-width:560px){.askrow{flex-wrap:wrap}.askrow .askin{flex:1 1 100%}.ptrow .ps{display:none}.pthead .hs{display:none}.pthead,.ptrow{grid-template-columns:22px minmax(0,1fr) auto auto}}

/* records */
.record{border:1px solid var(--line2);padding:16px;margin-bottom:18px}
.receyebrow{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.recname{font-size:25px;font-weight:500;line-height:1.15;margin:0 0 4px}
.recloc{font-style:italic;color:var(--mut);font-size:14px;margin-bottom:14px}
.meta3{display:grid;grid-template-columns:1fr;gap:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:14px}
@media(min-width:640px){.meta3{grid-template-columns:1fr 1fr}}
.meta3 .mlab{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.meta3 .mval{font-size:14px}
.frow{margin-bottom:14px}
.frow>label{display:block;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.ownerow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.newown{width:130px;padding:5px 8px;font-size:12.5px}
.note{font-size:13.5px;color:var(--mut);border-left:2px solid var(--line);padding-left:10px;margin-bottom:14px}
.ltline{font-size:14px;margin-bottom:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{display:inline-block;border:1px solid var(--line2);padding:7px 12px;font-size:13px;text-decoration:none;color:var(--ink);background:#fff}
.pill.go{font-style:italic}
.unv{flex:none;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut2);margin-left:6px;white-space:nowrap}
.pill.warn{border:none;padding:7px 0;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut2)}
.staffrow{display:flex;align-items:baseline;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.staffrow .sn{font-weight:500;white-space:nowrap}
.staffrow .sr{font-style:italic;font-size:12.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.staffrow .sd{font-size:12.5px;color:var(--mut);flex:none}
.touchrow{display:flex;gap:8px;flex-wrap:wrap}
.touchrow .textin{flex:1 1 100%}
.touchbtn{flex:1;border:1px solid var(--line2);background:#fff;padding:10px 0;font-size:11px;letter-spacing:.22em;text-transform:uppercase;border-radius:0}
.touchbtn:active{background:var(--ink);color:#fff}
.hist{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.hist b{font-weight:500;font-style:italic;color:var(--mut)}
textarea.textin{resize:vertical}

/* ask + landing zones */
.askrow{display:flex;gap:8px}
.askrow .askin{flex:1}
.askwho{width:132px;flex:none}
.askgo{flex:none}
.asknote{font-size:11.5px;color:var(--mut);margin-top:6px}
.reqzone{margin:4px 0 14px;border-top:1px solid var(--line)}
.req{padding:10px 0;border-bottom:1px solid var(--line)}
.req.ret{background:var(--tint);padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.reqhead{display:flex;align-items:baseline;gap:8px}
.reqhead b{font-weight:500;flex:1;min-width:0}
.reqmeta{font-size:11px;color:var(--mut);white-space:nowrap}
.remove{background:none;border:none;color:var(--mut);font-size:16px;padding:0 2px;line-height:1}
.reqbody{font-size:13px;color:var(--mut);margin-top:4px}

/* globe */
.ghead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:8px}
.ghead h2{font-size:22px;font-weight:500;margin:0}
.ghead .gsub{font-style:italic;font-size:12px;color:var(--mut)}
#globewrap{display:flex;justify-content:center;margin:4px 0 4px}
#globesvg{touch-action:none;cursor:grab;max-width:100%}
.cityhead{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--ink);padding-bottom:6px;margin-top:6px}
.cityhead h2{font-size:20px;font-weight:500;margin:0}
.cityhead .csub{font-size:12.5px;color:var(--mut);flex:1}
.stopbtn{background:none;border:none;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px;padding:0}
.gfirm{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.gfirm .gr{font-size:12px;color:var(--mut);width:14px;flex:none}
.gfirm .gn{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.gfirm .ga{font-size:12.5px;color:var(--mut);white-space:nowrap;flex:none}
.ghint{text-align:center;font-style:italic;font-size:12px;color:var(--mut2);padding:8px 0}

/* trips */
.stopcard{border-bottom:1px solid var(--line);padding:14px 0}
.stophead{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.stopnum{font-size:15px;color:var(--mut);font-style:italic;width:26px;flex:none;text-align:right}
.stopcity{font-size:19px;font-weight:500;flex:1}
.stopmeta{font-style:italic;font-size:12.5px;color:var(--mut);white-space:nowrap}
.stopfirms{font-size:13.5px;margin:0 0 8px 38px}
.stopactions{margin-left:38px;display:flex;gap:16px;align-items:center}
.draftbtn{background:none;border:none;font-size:10px;letter-spacing:.22em;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px;padding:0;color:var(--ink)}
.draftbtn.mut{color:var(--mut)}
.tripask{margin:10px 0 0 38px}
.tripactions{display:flex;gap:10px;margin-top:18px}
.tripactions .primary,.tripactions .secondary{flex:1}

/* toast + tabbar */
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:#fff;padding:9px 16px;font-size:13px;font-style:italic;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.tabbar{display:none}
@media(max-width:760px){
 .dnav{display:none}
 .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line2);z-index:40}
 .tabbar a{flex:1;text-align:center;padding:13px 0 15px;font-style:italic;color:var(--mut);text-decoration:none;font-size:14px}
 .tabbar a.active{font-style:normal;color:var(--ink);text-decoration:underline;text-underline-offset:4px}
}
body.locked .shell,body.locked .tabbar{display:none}
#lock{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;padding:28px;z-index:100}
#lock .lbox{max-width:340px;width:100%;text-align:center}
#lock .leyebrow{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--mut);margin-bottom:18px}
#lock h1{font-weight:500;font-size:26px;letter-spacing:.22em;margin:0 0 18px}
#lock .lrule{width:56px;height:1px;background:var(--ink);margin:0 auto 22px}
#lock .lhint{font-style:italic;color:var(--mut);font-size:14px;margin:0 0 24px}
#lock input[type=password]{width:100%;border:1px solid var(--line2);background:#fff;padding:12px 14px;font-size:16px;font-family:inherit;color:var(--ink);outline:0;text-align:center;border-radius:0}
#lock input[type=password]:focus{border-color:var(--ink)}
#lock button{width:100%;margin-top:10px;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:12px;font-size:12px;letter-spacing:.28em;text-transform:uppercase;font-family:inherit;cursor:pointer;border-radius:0}
#lock .lkeep{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:16px;color:var(--mut);font-size:12.5px;cursor:pointer}
#lock .lkeep input{width:15px;height:15px;accent-color:#141414}
#lock .lerr{color:#8a2f23;font-style:italic;font-size:13px;margin-top:14px;min-height:18px}
#lock .busy{opacity:.55;pointer-events:none}
</style></head><body class="locked"><div id="lock"><div class="lbox"><h1>NOVA GLOBE</h1><div class="lrule"></div><p class="lhint">Private. Enter the passphrase to open.</p><form id="lf" autocomplete="off"><input id="lpw" type="password" placeholder="Passphrase" autofocus><button type="submit" id="lgo">Open</button><label class="lkeep"><input type="checkbox" id="lkeep" checked>Keep unlocked on this device</label><div class="lerr" id="lerr"></div></form></div></div><main class="shell"><header class="top"><div><h1>NOVA GLOBE</h1></div><nav class="dnav"><a href="#/today" data-tab="today">Today</a><a href="#/pipeline" data-tab="pipeline">Pipeline</a><a href="#/map" data-tab="map">Globe</a></nav></header><section id="view"></section></main><nav class="tabbar"><a href="#/today" data-tab="today">Today</a><a href="#/pipeline" data-tab="pipeline">Pipeline</a><a href="#/map" data-tab="map">Globe</a></nav><div class="toast" id="toast"></div><script>

let firms=[];

const STAGES=[['new','Not started'],['contacted','Contacted'],['conversation','In conversation'],['meeting','Meeting'],['diligence','Diligence'],['committed','Committed'],['passed','Passed']];
function stageName(s){const x=STAGES.find(y=>y[0]===s);return x?x[1]:'Not started'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function linkify(s){return s.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">Source</a>')}
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayStr(){return dstr(new Date())}
function plusDays(n){const d=new Date();d.setDate(d.getDate()+n);return dstr(d)}
function fmtD(s){return new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}

let S={};
function loadS(){try{S=JSON.parse(localStorage.getItem('nova-globe-v1'))||{}}catch(e){S={}}if(!S.firms)S.firms={};if(!S.people)S.people={};if(!S.stops)S.stops=[];if(!S.owners)S.owners=['Zakaria','Koko','Carlo'];S.stops=S.stops.map(function(x){return String(x).split(',')[0].trim()});if(!S.reqs)S.reqs={};if(!S.seed){S.seed=1;S.reqs['firm:0']=[{id:1,d:todayStr(),kind:'return',title:'Firm brief - Abu Dhabi (sample)',by:'Instinct',body:'Sample landing zone: when you ask Instinct for a brief from a record, the answer arrives here with the firm context attached. Three rank-5 anchors in Abu Dhabi: ADIA, ADIC, Mubadala. Delete this sample anytime.'}];S.reqs['person:0:0']=[{id:2,d:todayStr(),kind:'return',title:'Draft intro email (sample)',by:'Instinct',body:'Sample landing zone: drafts you request from a person record arrive here, ready to review and send from your own email. Delete this sample anytime.'}]}}
function saveS(){localStorage.setItem('nova-globe-v1',JSON.stringify(S))}
function fs(fi){const k=String(fi);if(!S.firms[k])S.firms[k]={};return S.firms[k]}
function pkey(fi,ci){return fi+':'+ci}
function ps(fi,ci){const k=pkey(fi,ci);if(!S.people[k])S.people[k]={};return S.people[k]}
function stageOf(fi){const f=S.firms[String(fi)];return (f&&f.stage)||'new'}
function touchesOf(fi,ci){const p=S.people[pkey(fi,ci)];return (p&&p.touches)||[]}
function lastTouch(fi,ci){const t=touchesOf(fi,ci);return t.length?t[t.length-1]:null}
function ownersOf(fi){return fs(fi).owners||[]}
function pOwnersOf(fi,ci){return ps(fi,ci).owners||[]}
function initials(n){return n.trim().split(/\s+/).map(function(w){return w[0]}).join('').slice(0,2).toUpperCase()}
function avatars(list){if(!list||!list.length)return '';return '<span class="owns">'+list.slice(0,4).map(function(n){return '<span class="own" title="'+esc(n)+'">'+esc(initials(n))+'</span>'}).join('')+(list.length>4?'<span class="own more">+'+(list.length-4)+'</span>':'')+'</span>'}
function toggleFirmOwner(fi,name){const f=fs(fi);if(!f.owners)f.owners=[];const i=f.owners.indexOf(name);if(i>=0)f.owners.splice(i,1);else f.owners.push(name);saveS();render()}
function togglePersonOwner(fi,ci,name){const p=ps(fi,ci);if(!p.owners)p.owners=[];const i=p.owners.indexOf(name);if(i>=0)p.owners.splice(i,1);else p.owners.push(name);saveS();render()}
function addOwner(){const inp=document.getElementById('newowner');const n=inp?inp.value.trim():'';if(!n)return;if(S.owners.indexOf(n)<0)S.owners.push(n);saveS();render();toast(n+' added to the team')}
function firmOwnerEditor(fi){const cur=ownersOf(fi);return '<div class="ownerow">'+S.owners.map(function(n){return '<button class="chip ownchip'+(cur.indexOf(n)>=0?' on':'')+'" onclick="toggleFirmOwner('+fi+',\''+n.replace(/'/g,"\\'")+'\')">'+esc(n)+'</button>'}).join('')+'<input class="textin newown" id="newowner" placeholder="Add teammate…" onkeydown="if(event.key===\'Enter\'){addOwner();event.preventDefault()}"></div>'}
function personOwnerEditor(fi,ci){const cur=pOwnersOf(fi,ci);return '<div class="ownerow">'+S.owners.map(function(n){return '<button class="chip ownchip'+(cur.indexOf(n)>=0?' on':'')+'" onclick="togglePersonOwner('+fi+','+ci+',\''+n.replace(/'/g,"\\'")+'\')">'+esc(n)+'</button>'}).join('')+'<input class="textin newown" id="newowner" placeholder="Add teammate…" onkeydown="if(event.key===\'Enter\'){addOwner();event.preventDefault()}"></div>'}
function reqsOf(key){return S.reqs[key]||[]}
function askInstinct(kind,a,b){const inp=document.getElementById('askin');const who=document.getElementById('askwho');const t=inp?inp.value.trim():'';if(!t){toast('Type the outcome you need');return}const key=kind==='firm'?('firm:'+a):('person:'+a+':'+b);if(!S.reqs[key])S.reqs[key]=[];S.reqs[key].push({id:Date.now(),d:todayStr(),kind:'ask',text:t,by:who?who.value:S.owners[0],status:'With Instinct'});saveS();render();toast('Sent to your Instinct chat - answers land here')}
function dismissReq(key,id){const r=S.reqs[key]||[];for(let i=0;i<r.length;i++){if(r[i].id===id){r.splice(i,1);break}}saveS();render()}
function askBlock(kind,a,b){const key=kind==='firm'?('firm:'+a):('person:'+a+':'+b);const reqs=reqsOf(key);
 let h='<div class="frow"><label>Ask Instinct</label><div class="askrow"><input class="textin askin" id="askin" placeholder="Draft the intro, research the mandate…"><select class="select askwho" id="askwho">'+S.owners.map(function(n){return '<option value="'+esc(n)+'">For '+esc(n)+'</option>'}).join('')+'</select><button class="primary askgo" onclick="askInstinct(\''+kind+'\','+a+(kind==='person'?','+b:'')+')">Ask</button></div><div class="asknote">Hands the outcome to your Instinct conversation with this record attached. Drafts and research land back here. Prototype: requests stay on this device.</div></div>';
 if(reqs.length){h+='<div class="reqzone">'+reqs.slice().reverse().map(function(r){
  if(r.kind==='return')return '<div class="req ret"><div class="reqhead"><b>'+esc(r.title)+'</b><span class="reqmeta">From Instinct · '+fmtD(r.d)+'</span><button class="remove" onclick="dismissReq(\''+key+'\','+r.id+')">&times;</button></div><div class="reqbody">'+esc(r.body)+'</div></div>';
  return '<div class="req"><div class="reqhead"><b>'+esc(r.text)+'</b><span class="reqmeta">For '+esc(String(r.by).replace(/^For /,''))+' · '+fmtD(r.d)+' · '+esc(r.status||'With Instinct')+'</span><button class="remove" onclick="dismissReq(\''+key+'\','+r.id+')">&times;</button></div></div>'}).join('')+'</div>'}
 return h}


function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(function(){t.classList.remove('show')},1800)}
function go(h){location.hash=h}

function setStage(fi,v){fs(fi).stage=v;saveS();toast('Stage: '+stageName(v));render()}
function setFirmField(fi,field,v){fs(fi)[field]=v;saveS()}
function setPersonField(fi,ci,field,v){ps(fi,ci)[field]=v;saveS()}
function logTouch(fi,ci,type){const inp=document.getElementById('touchnote');const note=inp?inp.value.trim():'';const p=ps(fi,ci);if(!p.touches)p.touches=[];p.touches.push({d:todayStr(),type:type,note:note});if(stageOf(fi)==='new'){fs(fi).stage='contacted'}saveS();render();toast(type+' logged')}
function setFollowUp(fi,ci,v){const p=ps(fi,ci);if(v){p.followUp=v}else{delete p.followUp}saveS();render();if(v)toast('Follow-up set for '+fmtD(v))}
function toggleStop(city){const i=S.stops.indexOf(city);if(i>=0){S.stops.splice(i,1)}else{S.stops.push(city)}saveS();render()}
function clearStops(){S.stops=[];saveS();render();toast('Trip plan cleared')}

function clusters(){const m={};firms.forEach(function(f,i){const k=f.location||'Unknown';if(!m[k])m[k]={name:k,firms:[],top:0};m[k].firms.push(i);m[k].top=Math.max(m[k].top,f.rankNum)});return Object.values(m).sort(function(a,b){return b.top-a.top||b.firms.length-a.firms.length||a.name.localeCompare(b.name)})}
function clusterContacts(c){return c.firms.reduce(function(a,i){return a+firms[i].contacts.length},0)}
function copyTrip(){if(!S.stops.length){toast('No stops yet');return}const cs=clusters();const lines=['NOVA GLOBE - Trip plan ('+fmtD(todayStr())+')',''];S.stops.forEach(function(city){const c=cs.find(function(x){return x.name===city});if(!c)return;lines.push(city+' - '+c.firms.length+' firms, '+clusterContacts(c)+' contacts');c.firms.map(function(i){return firms[i]}).sort(function(a,b){return b.rankNum-a.rankNum||a.name.localeCompare(b.name)}).forEach(function(f){lines.push('  '+f.name+' (Rank '+f.rankNum+') - '+f.contacts.length+' contacts')});lines.push('')});const text=lines.join('\n');const done=function(){toast('Itinerary copied')};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(function(){fallbackCopy(text);done()})}else{fallbackCopy(text);done()}}
function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()}

function curRoute(){const h=(location.hash||'#/today').slice(2);const p=h.split('/');return {view:p[0]||'today',a:p[1],b:p[2]}}
function route(){render();window.scrollTo(0,0)}
function render(){const r=curRoute();const v=document.getElementById('view');
 if(r.view==='pipeline'){v.innerHTML=viewPipeline();renderPlRows()}
 else if(r.view==='firm'){v.innerHTML=viewFirm(+r.a)}
 else if(r.view==='person'){v.innerHTML=viewPerson(+r.a,+r.b)}
 else if(r.view==='map'){v.innerHTML=viewMap();renderMapContent()}

 else{v.innerHTML=viewToday()}
 document.querySelectorAll('[data-tab]').forEach(function(a){const t=a.getAttribute('data-tab');a.classList.toggle('active',t===r.view||(r.view==='firm'&&t==='pipeline')||(r.view==='person'&&t==='pipeline'))});
}

function viewToday(){
 const t=todayStr(),w=plusDays(7);
 const fups=[];
 Object.keys(S.people).forEach(function(k){const p=S.people[k];if(p.followUp){const parts=k.split(':');const fi=+parts[0],ci=+parts[1];if(firms[fi]&&firms[fi].contacts[ci])fups.push({fi:fi,ci:ci,date:p.followUp})}});
 fups.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
 const due=fups.filter(function(f){return f.date<=t});
 const up=fups.filter(function(f){return f.date>t&&f.date<=w});
 const sugg=firms.map(function(f,i){return {f:f,i:i}}).filter(function(x){return stageOf(x.i)==='new'}).sort(function(a,b){return b.f.rankNum-a.f.rankNum||a.f.name.localeCompare(b.f.name)}).slice(0,6);
 const inMotion=Object.keys(S.firms).filter(function(k){return S.firms[k].stage&&S.firms[k].stage!=='new'}).length;
 const totalC=firms.reduce(function(a,f){return a+f.contacts.length},0);
 const cs=clusters();
 let h='<div class="todate">'+new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+'</div>';
 h+='<div class="tstats"><div class="tstat"><b>'+firms.length+'</b><span>Firms</span></div><div class="tstat"><b>'+totalC+'</b><span>People</span></div><div class="tstat"><b>'+inMotion+'</b><span>In motion</span></div><div class="tstat"><b>'+S.stops.length+'</b><span>Trip stops</span></div></div>';
 h+='<div class="sect"><div class="secthead">Follow-ups</div>';
 if(!due.length&&!up.length)h+='<div class="quiet">Nothing scheduled. Set a follow-up date from any person record.</div>';
 due.forEach(function(f){const c=firms[f.fi].contacts[f.ci];h+='<div class="qitem" onclick="go(\'#/person/'+f.fi+'/'+f.ci+'\')"><div class="qbody"><b>'+esc(c.name)+'</b><span>'+esc(firms[f.fi].name)+'</span></div><div class="due'+(f.date<t?' over':'')+'">'+(f.date===t?'Today':'Overdue · '+fmtD(f.date))+'</div></div>'});
 up.forEach(function(f){const c=firms[f.fi].contacts[f.ci];h+='<div class="qitem" onclick="go(\'#/person/'+f.fi+'/'+f.ci+'\')"><div class="qbody"><b>'+esc(c.name)+'</b><span>'+esc(firms[f.fi].name)+'</span></div><div class="due">'+fmtD(f.date)+'</div></div>'});
 h+='</div>';
 h+='<div class="sect"><div class="secthead">Next moves <span>suggested from rank</span></div>';
 sugg.forEach(function(x){const f=x.f;const c0=f.contacts[0];
  h+='<div class="qitem" onclick="go(\'#/firm/'+x.i+'\')"><div class="rank r'+f.rankNum+'">'+f.rankNum+'</div><div class="qbody"><b>'+esc(f.name)+'</b><span>'+(c0?('Rank '+f.rankNum+', no touch yet - first move: email '+esc(c0.name)+(c0.role?', '+esc(c0.role):'')):'Rank '+f.rankNum+', no contacts mapped yet')+'</span></div><div class="qgo">Open</div></div>'});
 h+='</div>';
 if(S.stops.length){h+='<div class="sect"><div class="secthead">Trip plan</div>';S.stops.forEach(function(city){const c=cs.find(function(x){return x.name===city});if(!c)return;h+='<div class="qitem" onclick="go(\'#/trips\')"><div class="qbody"><b>'+esc(city)+'</b><span>'+c.firms.length+' firms · '+clusterContacts(c)+' contacts</span></div><div class="qgo">View</div></div>'});h+='</div>'}
 return h;
}

let plQ='',plStage='all',plOwner='all';
function viewPipeline(){
 const counts={};STAGES.forEach(function(s){counts[s[0]]=0});firms.forEach(function(f,i){counts[stageOf(i)]++});
 let h='<div class="ptools"><label class="search"><span>⌕</span><input id="plq" placeholder="Search firms, types, cities…" value="'+esc(plQ)+'" oninput="plQ=this.value;renderPlRows()"></label><select class="select" onchange="plOwner=this.value;renderPlRows()"><option value="all">All owners</option><option value="none">No owner yet</option>'+S.owners.map(function(n){return '<option'+(n===plOwner?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select></div>';
 h+='<div class="chips"><button class="chip'+(plStage==='all'?' on':'')+'" onclick="plStage=\'all\';render()">All · '+firms.length+'</button>';
 STAGES.forEach(function(s){h+='<button class="chip'+(plStage===s[0]?' on':'')+'" onclick="plStage=\''+s[0]+'\';render()">'+s[1]+' · '+counts[s[0]]+'</button>'});
 h+='</div><div id="plrows"></div>';
 return h;
}
function renderPlRows(){const el=document.getElementById('plrows');if(!el)return;const q=plQ.trim().toLowerCase();
 const rows=firms.map(function(f,i){return {f:f,i:i}}).filter(function(x){return (plStage==='all'||stageOf(x.i)===plStage)&&(plOwner==='all'||(plOwner==='none'?!ownersOf(x.i).length:ownersOf(x.i).indexOf(plOwner)>=0))&&(!q||x.f.name.toLowerCase().indexOf(q)>=0||(x.f.type||'').toLowerCase().indexOf(q)>=0||(x.f.location||'').toLowerCase().indexOf(q)>=0)}).sort(function(a,b){return b.f.rankNum-a.f.rankNum||a.f.name.localeCompare(b.f.name)});
 if(!rows.length){el.innerHTML='<div class="empty">No firms match.</div>';return}
 el.innerHTML=rows.map(function(x){const f=x.f;const st=stageOf(x.i);return '<div class="prow" onclick="go(\'#/firm/'+x.i+'\')"><div class="rank r'+f.rankNum+'">'+f.rankNum+'</div><div class="qbody"><b>'+esc(f.name)+'</b><span>'+esc(f.location||'')+(f.type?' · '+esc(f.type):'')+' · '+f.contacts.length+' contacts</span></div>'+avatars(ownersOf(x.i))+'<div class="stagepill st-'+st+'">'+stageName(st)+'</div></div>'}).join('');
}

 const st=stageOf(fi);const F=S.firms[String(fi)]||{};
 let h='<div class="back" onclick="go(\'#/pipeline\')">&larr; Pipeline</div>';
 h+='<div class="record"><div class="rechead"><div class="rank r'+f.rankNum+' big">'+f.rankNum+'</div><div><h2>'+esc(f.name)+'</h2><div class="meta">'+esc(f.location||'')+(f.type?'<span class="dot">· '+esc(f.type)+'</span>':'')+'</div></div></div>';
 h+='<div class="firmfacts"><div>Rank<strong>'+esc(f.rank||f.rankNum)+'</strong></div><div>AUM<strong>'+esc(f.aum||'—')+'</strong></div><div>Type<strong>'+esc(f.type||'—')+'</strong></div><div>Location<strong>'+esc(f.location||'—')+'</strong></div></div>';
 h+='<div class="frow"><label>Stage</label><select class="select" onchange="setStage('+fi+',this.value)">'+STAGES.map(function(s){return '<option value="'+s[0]+'"'+(s[0]===st?' selected':'')+'>'+s[1]+'</option>'}).join('')+'</select></div>';
 h+='<div class="frow"><label>Relationship owners</label>'+firmOwnerEditor(fi)+'</div>';
 h+=askBlock('firm',fi);
 h+='<div class="frow"><label>Warm intro via</label><input class="textin" placeholder="Who can open this door…" value="'+esc(F.introVia||'')+'" onchange="setFirmField('+fi+',\'introVia\',this.value)"></div>';
 h+='<div class="frow"><label>Firm notes</label><textarea class="textin" rows="2" placeholder="Context, angle, mandate…" onchange="setFirmField('+fi+',\'notes\',this.value)">'+esc(F.notes||'')+'</textarea></div>';
 h+='<div class="secthead gap">Investment staff <span>'+f.contacts.length+'</span></div>';
 f.contacts.forEach(function(c,ci){const lt=lastTouch(fi,ci);
  h+='<div class="prow" onclick="go(\'#/person/'+fi+'/'+ci+'\')"><div class="qbody"><b>'+esc(c.name)+'</b><span>'+esc(c.role||'')+'</span></div>'+avatars(pOwnersOf(fi,ci))+'<div class="lt">'+(lt?(lt.type+' · '+fmtD(lt.d)):'No touch yet')+'</div></div>'});
 h+='</div>';

function viewPerson(fi,ci){const f=firms[fi];const c=f&&f.contacts[ci];if(!c)return '<div class="empty">Person not found.</div>';
 const P=S.people[pkey(fi,ci)]||{};const lt=lastTouch(fi,ci);const touches=touchesOf(fi,ci);
 const first=(c.name||'').split(' ')[0];
 const mail=c.email?('mailto:'+c.email+'?subject='+encodeURIComponent('Nova x '+f.name)+'&body='+encodeURIComponent('Hi '+first+',\n\n')):'';

 h+='<div class="actions">';
 if(c.email)h+='<a class="pill" href="'+mail+'">'+esc(c.email)+'</a>';
 if(c.unverified)h+='<span class="pill warn">Unverified email</span>';
 if(c.linkedin)h+='<a class="pill" href="'+esc(c.linkedin)+'" target="_blank" rel="noopener">LinkedIn &#8599;</a>';
 h+='</div>';
 if(c.notes)h+='<div class="note">'+linkify(esc(c.notes))+'</div>';
 h+='<div class="ltline">Last touch: <b>'+(lt?(lt.type+' · '+fmtD(lt.d)):'never')+'</b></div>';
 h+='<div class="frow"><label>Log a touch</label><div class="touchrow"><input class="textin" id="touchnote" placeholder="Note (optional)…"><button class="touchbtn" onclick="logTouch('+fi+','+ci+',\'Email\')">Email</button><button class="touchbtn" onclick="logTouch('+fi+','+ci+',\'Call\')">Call</button><button class="touchbtn" onclick="logTouch('+fi+','+ci+',\'Meeting\')">Meeting</button></div></div>';
 h+='<div class="frow"><label>Follow-up date</label><div class="touchrow"><input class="textin" type="date" value="'+(P.followUp||'')+'" onchange="setFollowUp('+fi+','+ci+',this.value)">'+(P.followUp?'<button class="touchbtn" onclick="setFollowUp('+fi+','+ci+',\'\')">Clear</button>':'')+'</div></div>';
 h+='<div class="frow"><label>Relationship owners</label>'+personOwnerEditor(fi,ci)+'</div>';
 h+=askBlock('person',fi,ci);
 h+='<div class="frow"><label>Warm intro via</label><input class="textin" placeholder="Who can intro you…" value="'+esc(P.introVia||'')+'" onchange="setPersonField('+fi+','+ci+',\'introVia\',this.value)"></div>';
 h+='<div class="frow"><label>Notes</label><textarea class="textin" rows="3" placeholder="What they care about, angle, context…" onchange="setPersonField('+fi+','+ci+',\'notes\',this.value)">'+esc(P.notes||'')+'</textarea></div>';
 if(touches.length){h+='<div class="secthead gap">History</div>';touches.slice().reverse().forEach(function(t){h+='<div class="hist"><b>'+fmtD(t.d)+'</b> · '+esc(t.type)+(t.note?' — '+esc(t.note):'')+'</div>'})}

let mapQ='',mapRank='all',mapType='all',mapView='firm';
function mapTypes(){const s={};firms.forEach(function(f){if(f.type)s[f.type]=1});return Object.keys(s).sort()}
function viewMap(){
 let h='<div class="ptools"><label class="search"><span>⌕</span><input id="mapq" placeholder="Search firms, people, roles, notes…" value="'+esc(mapQ)+'" oninput="mapQ=this.value;renderMapContent()"></label>';
 h+='<select class="select" onchange="mapRank=this.value;renderMapContent()"><option value="all">All ranks</option>'+[5,4,3,2,1].map(function(r){return '<option value="'+r+'"'+(String(r)===mapRank?' selected':'')+'>Rank '+r+'</option>'}).join('')+'</select>';
 h+='<select class="select" onchange="mapType=this.value;renderMapContent()"><option value="all">All LP types</option>'+mapTypes().map(function(t){return '<option'+(t===mapType?' selected':'')+'>'+esc(t)+'</option>'}).join('')+'</select>';
 h+='<div class="seg"><button class="'+(mapView==='firm'?'active':'')+'" onclick="mapView=\'firm\';render()">By firm</button><button class="'+(mapView==='location'?'active':'')+'" onclick="mapView=\'location\';render()">By location</button></div></div>';
 h+='<div class="resultline"><span id="mapshown"></span><span>Rank 5 = highest priority</span></div><div id="mapcontent"></div>';
 return h;
}
function firmMatches(f,q){if(!q)return true;const hay=(f.name+' '+(f.type||'')+' '+(f.location||'')+' '+(f.notes||'')+' '+f.contacts.map(function(c){return c.name+' '+(c.role||'')+' '+(c.email||'')+' '+(c.notes||'')}).join(' ')).toLowerCase();return hay.indexOf(q)>=0}
function mapCard(f,i){
 let h='<div class="card"><div class="cardhead" onclick="this.parentNode.classList.toggle(\'open\')"><div class="rank r'+f.rankNum+'">'+f.rankNum+'</div><div class="cardtitle"><h2>'+esc(f.name)+'</h2><div class="meta">'+esc(f.location||'')+(f.type?'<span>· '+esc(f.type)+'</span>':'')+'</div></div>'+avatars(ownersOf(i))+'<div class="count">'+f.contacts.length+' contacts +</div></div>';
 h+='<div class="details"><div class="firmfacts"><div>Rank<strong>'+esc(f.rank||'')+'</strong></div><div>AUM<strong>'+esc(f.aum||'—')+'</strong></div><div>Type<strong>'+esc(f.type||'—')+'</strong></div></div>';
 h+='<div class="actions" style="margin:0 0 6px"><a class="pill go" href="#/firm/'+i+'">Firm record &#8594;</a></div>';
 f.contacts.forEach(function(c,ci){h+='<div class="contact"><div class="person">'+esc(c.name)+'</div><div class="role">'+esc(c.role||'')+'</div><div class="actions">';
  if(c.email)h+='<a class="pill" href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a>';
  if(c.unverified)h+='<span class="pill warn">Unverified</span>';
  if(c.linkedin)h+='<a class="pill" href="'+esc(c.linkedin)+'" target="_blank" rel="noopener">LinkedIn &#8599;</a>';
  h+='<a class="pill go" href="#/person/'+i+'/'+ci+'">Record &#8594;</a>';
  h+='</div>'+(c.notes?'<div class="note">'+linkify(esc(c.notes))+'</div>':'')+'</div>'});
 h+='</div></div>';return h;
}
function renderMapContent(){const el=document.getElementById('mapcontent');if(!el)return;const q=mapQ.trim().toLowerCase();
 const match=firms.map(function(f,i){return {f:f,i:i}}).filter(function(x){return (mapRank==='all'||x.f.rankNum===+mapRank)&&(mapType==='all'||x.f.type===mapType)&&firmMatches(x.f,q)});
 const shown=document.getElementById('mapshown');
 if(mapView==='firm'){
  if(shown)shown.textContent=match.length+' firms · '+match.reduce(function(a,x){return a+x.f.contacts.length},0)+' contacts';
  if(!match.length){el.innerHTML='<div class="empty">No matches. Try widening the filters.</div>';return}
  el.innerHTML='<div class="grid">'+match.map(function(x){return mapCard(x.f,x.i)}).join('')+'</div>';
 }else{
  const keep={};match.forEach(function(x){keep[x.i]=1});
  const cs=clusters().map(function(c){const fl=c.firms.filter(function(i){return keep[i]});return {name:c.name,top:c.top,firms:fl}}).filter(function(c){return c.firms.length});
  if(shown)shown.textContent=cs.length+' locations';
  if(!cs.length){el.innerHTML='<div class="empty">No matches. Try widening the filters.</div>';return}
  el.innerHTML='<div class="locations">'+cs.map(function(c){
   const pairs=c.firms.map(function(i){return {f:firms[i],i:i}}).sort(function(a,b){return b.f.rankNum-a.f.rankNum||a.f.name.localeCompare(b.f.name)});
   const cc=c.firms.reduce(function(a,i){return a+firms[i].contacts.length},0);
   let h='<div class="loc"><div class="lochead"><div><h2>'+esc(c.name)+'</h2><div class="locsummary">'+c.firms.length+' firms · '+cc+' contacts · top rank '+c.top+'</div></div><button class="addstop'+(S.stops.indexOf(c.name)>=0?' on':'')+'" data-city="'+esc(c.name)+'" onclick="toggleStop(this.dataset.city)">'+(S.stops.indexOf(c.name)>=0?'Stop added ✓':'Add stop +')+'</button></div>';
   pairs.forEach(function(p){h+='<div class="firmrow"><button onclick="go(\'#/firm/'+p.i+'\')">'+esc(p.f.name)+'</button><div class="meta">Rank '+p.f.rankNum+(p.f.aum?' · '+esc(p.f.aum):'')+' · '+p.f.contacts.length+' contacts</div></div>'});
   h+='</div>';return h}).join('')+'</div>';
 }
}

function viewTrips(){const cs=clusters();
 let h='<div class="secthead" style="margin-top:0">Trip plan <span>Saved on this device</span></div>';
 if(!S.stops.length){h+='<div class="empty">No stops yet.<br>Open the LP Map, switch to By location, and add cities.</div><div class="tripactions" style="justify-content:center"><button class="primary" onclick="mapView=\'location\';go(\'#/map\')">Browse locations</button></div>';return h}
 S.stops.forEach(function(city){const c=cs.find(function(x){return x.name===city});if(!c)return;
  const top=c.firms.map(function(i){return {f:firms[i],i:i}}).sort(function(a,b){return b.f.rankNum-a.f.rankNum||a.f.name.localeCompare(b.f.name)});
  h+='<div class="stopcard"><div class="stophead"><div><b>'+esc(city)+'</b><span>'+c.firms.length+' firms · '+clusterContacts(c)+' contacts</span></div><button class="remove" data-city="'+esc(city)+'" onclick="toggleStop(this.dataset.city)">×</button></div>';
  top.slice(0,8).forEach(function(p){h+='<div class="firmrow"><button onclick="go(\'#/firm/'+p.i+'\')">'+esc(p.f.name)+'</button><div class="meta">Rank '+p.f.rankNum+' · '+p.f.contacts.length+' contacts</div></div>'});
  if(top.length>8)h+='<div class="quiet pad">+ '+(top.length-8)+' more firms in the map</div>';
  h+='</div>'});
 h+='<div class="tripactions"><button class="primary" onclick="copyTrip()">Copy itinerary</button><button class="secondary" onclick="clearStops()">Clear all</button><button class="secondary" onclick="mapView=\'location\';go(\'#/map\')">Add cities</button></div>';
 return h;
}

function startApp(){loadS();window.addEventListener('hashchange',route);if(!location.hash)location.hash='#/today';route()}

function cityClusters(){const m={};firms.forEach(function(f,i){const k=cityKey(f.location);if(!k||k==='Location unknown'||k==='Unknown')return;if(!m[k])m[k]={name:k,firms:[],top:0};m[k].firms.push(i);m[k].top=Math.max(m[k].top,f.rankNum)});return Object.values(m).sort(function(a,b){return b.firms.length-a.firms.length||b.top-a.top||a.name.localeCompare(b.name)})}
function knowsOf(fi){return fs(fi).knows||[]}
function pKnowsOf(fi,ci){return ps(fi,ci).knows||[]}
function toggleName(scope,a,b,field,name){const o=scope==='firm'?fs(a):ps(a,b);if(!o[field])o[field]=[];const i=o[field].indexOf(name);if(i>=0)o[field].splice(i,1);else o[field].push(name);saveS();render()}
function nameEditor(scope,a,b,field){const cur=scope==='firm'?(field==='owners'?ownersOf(a):knowsOf(a)):(field==='owners'?pOwnersOf(a,b):pKnowsOf(a,b));const iid='nt-'+field+'-'+scope;const oc=scope==='firm'?('toggleName(\'firm\','+a+',0,\''+field+'\'')+',\'' : ('toggleName(\'person\','+a+','+b+',\''+field+'\'')+',\'';
 return '<div class="ownerow">'+S.owners.map(function(n){return '<button class="chip ownchip'+(cur.indexOf(n)>=0?' on':'')+'" onclick="'+oc+n.replace(/'/g,"\\'")+'\')">'+esc(n)+'</button>'}).join('')+'<input class="textin newown" id="'+iid+'" placeholder="Add teammate…" onkeydown="if(event.key===\'Enter\'){addTeamName(\''+field+'\',\''+scope+'\');event.preventDefault()}"></div>'}
function addTeamName(field,scope){const inp=document.getElementById('nt-'+field+'-'+scope);const n=inp?inp.value.trim():'';if(!n)return;if(S.owners.indexOf(n)<0)S.owners.push(n);saveS();render();toast(n+' added to the team')}

let selCity=null,globeInit=false,globeProj=null,globeCountries=null,globeCities=[],globeDragged=false;
function viewMap(){
 const cs=cityClusters();
 const loc=cs.length;
 return '<div class="ghead"><h2>Globe</h2><div class="gsub">'+loc+' locations · '+firms.length+' firms</div></div><div id="globewrap"><svg id="globesvg"></svg></div><div class="ghint">drag to turn · tap a city</div><div id="citypanel"></div>';
}
function initGlobe(){
 const el=document.getElementById('globesvg');if(!el||typeof d3==='undefined')return;
 const W=Math.min(document.getElementById('view').clientWidth||360,430),H=Math.round(W*0.66),R=W*0.46;
 const cs=cityClusters();
 globeCities=cs.map(function(c){const co=COORDS[c.name];return co?{n:c.name,c:co,f:c.firms.length,top:c.top}:null}).filter(Boolean);
 if(!selCity||!globeCities.some(function(x){return x.n===selCity}))selCity=globeCities.length?globeCities[0].n:null;
 const svg=d3.select(el).attr('width',W).attr('height',H).attr('viewBox','0 0 '+W+' '+H);svg.selectAll('*').remove();
 const proj=d3.geoOrthographic().scale(R).translate([W/2,H*0.9]).clipAngle(90).rotate([60,-30]);globeProj=proj;
 const path=d3.geoPath(proj);
 const sphere=svg.append('path').datum({type:'Sphere'}).attr('fill','#fff').attr('stroke','#141414').attr('stroke-width',1);
 const grat=svg.append('path').datum(d3.geoGraticule10()).attr('fill','none').attr('stroke','#141414').attr('stroke-opacity',.13).attr('stroke-width',.6);
 const land=svg.append('path').attr('fill','#141414').attr('fill-opacity',.07).attr('stroke','#141414').attr('stroke-opacity',.5).attr('stroke-width',.6);
 const dots=svg.append('g'),labels=svg.append('g');
 if(!globeCountries&&typeof WORLD!=='undefined'){try{globeCountries=topojson.feature(WORLD,WORLD.objects.countries)}catch(e){}}
 function draw(){sphere.attr('d',path);grat.attr('d',path);if(globeCountries)land.attr('d',path(globeCountries));
  const vis=function(c){const r=proj.rotate();return d3.geoDistance(c.c,[-r[0],-r[1]])<Math.PI/2};
  const ds=dots.selectAll('circle').data(globeCities.filter(vis),function(d){return d.n});
  ds.join('circle').attr('cx',function(d){return proj(d.c)[0]}).attr('cy',function(d){return proj(d.c)[1]}).attr('r',function(d){return d.n===selCity?5:Math.max(2,Math.sqrt(d.f)*1.2)}).attr('fill',function(d){return d.n===selCity?'#141414':'#fff'}).attr('stroke','#141414').attr('stroke-width',1.2).style('cursor','pointer').on('click',function(e,d){selCity=d.n;globeDragged=true;draw();renderGlobeCity()});
  var placed=[];var lcand=globeCities.filter(function(d){return vis(d)&&(d.f>=10||d.n===selCity)}).sort(function(a,b){return (b.n===selCity)-(a.n===selCity)||b.f-a.f}).filter(function(d){var p=proj(d.c);for(var i=0;i<placed.length;i++){if(Math.abs(placed[i][0]-p[0])<56&&Math.abs(placed[i][1]-p[1])<14)return false}placed.push(p);return true});
  const ls=labels.selectAll('text').data(lcand,function(d){return d.n});
  ls.join('text').attr('x',function(d){return proj(d.c)[0]+8}).attr('y',function(d){return proj(d.c)[1]+4}).text(function(d){return d.n}).attr('font-size','11px').attr('font-style',function(d){return d.n===selCity?'normal':'italic'}).attr('font-weight',function(d){return d.n===selCity?'600':'400'}).attr('fill',function(d){return d.n===selCity?'#141414':'rgba(0,0,0,.55)'}).attr('pointer-events','none');
 }
 const drag=d3.drag().on('start',function(){globeDragged=true}).on('drag',function(e){const r=proj.rotate();proj.rotate([r[0]+e.dx*0.4,Math.max(-70,Math.min(70,r[1]-e.dy*0.4))]);draw()});
 svg.call(drag);
 d3.timer(function(){if(!document.getElementById('globesvg'))return true;if(globeDragged)return false;const r=proj.rotate();proj.rotate([r[0]+0.05,r[1]]);draw();return false});
 draw();
}
function renderGlobeCity(){
 const el=document.getElementById('citypanel');if(!el||!selCity)return;
 const cs=cityClusters();const c=cs.find(function(x){return x.name===selCity});
 if(!c){el.innerHTML='';return}
 const cc=clusterContacts(c);
 const pairs=c.firms.map(function(i){return {f:firms[i],i:i}}).sort(function(a,b){return b.f.rankNum-a.f.rankNum||a.f.name.localeCompare(b.f.name)});
 let h='<div class="cityhead"><h2>'+esc(selCity)+'</h2><div class="csub">'+c.firms.length+' firms · '+cc+' contacts</div></div>';
 pairs.forEach(function(p){h+='<div class="gfirm" onclick="go(\'#/firm/'+p.i+'\')"><span class="gr">'+p.f.rankNum+'</span><span class="gn">'+esc(p.f.name)+'</span>'+avatars(ownersOf(p.i))+'<span class="lead"></span><span class="ga">'+(p.f.aum?esc(p.f.aum)+' · ':'')+p.f.contacts.length+' contacts</span></div>'});
 el.innerHTML=h;
}
function renderMapContent(){initGlobe();renderGlobeCity()}

function tripAskBlock(city,i){const key='trip:'+city;const reqs=reqsOf(key);

function askTrip(i){const inp=document.getElementById('tain'+i);const who=document.getElementById('tawho'+i);const city=S.stops[i];const t=inp?inp.value.trim():'';if(!t){toast('Type the outcome you need');return}const key='trip:'+city;if(!S.reqs[key])S.reqs[key]=[];S.reqs[key].push({id:Date.now(),d:todayStr(),kind:'ask',text:t+' ('+city+')',by:who?who.value:S.owners[0],status:'With Instinct'});saveS();render();toast('Sent to your Instinct chat - answers land here')}
function viewTrips(){const cs=cityClusters();
 let h='<div class="secthead" style="margin-top:0">Trip plan<span>'+(S.stops.length?S.stops.length+' stops':'saved on this device')+'</span></div>';
 if(!S.stops.length){h+='<div class="empty">No stops yet.<br>Open the Globe, tap a city, and add it as a stop.</div><div class="tripactions"><button class="primary" onclick="go(\'#/map\')">Open the Globe</button></div>';return h}
 S.stops.forEach(function(city,si){const c=cs.find(function(x){return x.name===city});if(!c)return;
  const days=Math.max(1,Math.ceil(c.firms.length/3));

  h+='<div class="stopactions"><button class="draftbtn" onclick="var e=document.getElementById(\'tripask-'+si+'\');e.style.display=e.style.display===\'none\'?\'\':\'none\'">Draft asks</button><button class="draftbtn mut" data-city="'+esc(city)+'" onclick="toggleStop(this.dataset.city)">Remove</button></div>';
  h+='<div id="tripask-'+si+'" style="display:none"><div class="tripask" style="margin-top:10px"><div class="askrow"><input class="textin askin" id="tain'+si+'" placeholder="Draft the asks for '+esc(city)+'…"><select class="select askwho" id="tawho'+si+'">'+S.owners.map(function(n){return '<option value="'+esc(n)+'">For '+esc(n)+'</option>'}).join('')+'</select><button class="primary askgo" onclick="askTrip('+si+')">Ask</button></div><div class="asknote">Outcome goes to your Instinct conversation with the '+esc(city)+' stop attached. Prototype: stays on this device.</div></div></div>';
  if(reqs.length){h+='<div class="reqzone" style="margin:10px 0 0 38px">'+reqs.slice().reverse().map(function(r){
   if(r.kind==='return')return '<div class="req ret"><div class="reqhead"><b>'+esc(r.title)+'</b><span class="reqmeta">From Instinct · '+fmtD(r.d)+'</span><button class="remove" onclick="dismissReq(\''+key+'\','+r.id+')">&times;</button></div><div class="reqbody">'+esc(r.body)+'</div></div>';
   return '<div class="req"><div class="reqhead"><b>'+esc(r.text)+'</b><span class="reqmeta">For '+esc(String(r.by).replace(/^For /,''))+' · '+fmtD(r.d)+' · '+esc(r.status||'With Instinct')+'</span><button class="remove" onclick="dismissReq(\''+key+'\','+r.id+')">&times;</button></div></div>'}).join('')+'</div>'}
  h+='</div>'});
 h+='<div class="tripactions"><button class="primary" onclick="copyTrip()">Copy plan</button><button class="secondary" onclick="clearStops()">Clear</button></div>';
 return h;
}

function b64u(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function deriveKey(pw){var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64u(LS),iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt'])}
async function openWith(key){
  try{
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u(LI)},key,b64u(LD));
    firms=JSON.parse(new TextDecoder().decode(pt));
    document.body.classList.remove('locked');
    var lk=document.getElementById('lock');if(lk)lk.remove();
    startApp();
    return true;
  }catch(e){return false}
}
(async function(){
  var saved=localStorage.getItem('nova-globe-key')||sessionStorage.getItem('nova-globe-key');
  if(saved){try{var raw=b64u(saved);var key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);var ok=await openWith(key);if(!ok){localStorage.removeItem('nova-globe-key');sessionStorage.removeItem('nova-globe-key');location.reload()}return}catch(e){}}
})();
document.getElementById('lf').addEventListener('submit',async function(ev){
  ev.preventDefault();
  var pw=document.getElementById('lpw').value,err=document.getElementById('lerr'),btn=document.getElementById('lgo');
  if(!pw){err.textContent='Enter the passphrase.';return}
  btn.classList.add('busy');btn.textContent='Opening';err.textContent='';
  try{
    var key=await deriveKey(pw);
    var raw=await crypto.subtle.exportKey('raw',key);
    var ok=await openWith(key);
    if(!ok){err.textContent='Wrong passphrase.';btn.classList.remove('busy');btn.textContent='Open';return}
    var b64k=btoa(String.fromCharCode.apply(null,new Uint8Array(raw)));
    if(document.getElementById('lkeep').checked){localStorage.setItem('nova-globe-key',b64k)}else{sessionStorage.setItem('nova-globe-key',b64k)}
  }catch(e){err.textContent='Something went wrong. Try again.';btn.classList.remove('busy');btn.textContent='Open'}
});
